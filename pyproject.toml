[tool.uv]
constraint-dependencies = [
    "fastapi>=0.148.0",
    "httpx2>=2.14.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.5",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.workspace]
members = ["apps/*-py", "packages/*-py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["allocation"]
